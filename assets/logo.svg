<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460">
  <defs>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2b1f"/>
      <stop offset="45%" stop-color="#e2261b"/>
      <stop offset="100%" stop-color="#b31610"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f2f2f2"/>
      <stop offset="100%" stop-color="#d9d9d9"/>
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="700" height="460" rx="20" fill="#161819"/>

  <!-- big 4M group, italic slant -->
  <g transform="translate(70,0) skewX(-10)">
    <!-- Red 4 -->
    <text x="20" y="290"
          font-family="Arial Black, Arial, sans-serif"
          font-weight="900"
          font-size="330"
          fill="url(#redGrad)"
          letter-spacing="-10">4</text>

    <!-- White M -->
    <text x="240" y="290"
          font-family="Arial Black, Arial, sans-serif"
          font-weight="900"
          font-size="300"
          fill="url(#whiteGrad)"
          letter-spacing="-8">M</text>
  </g>

  <!-- AUTOTECH text -->
  <text x="70" y="415"
        font-family="Arial Black, Arial, sans-serif"
        font-weight="900"
        font-size="72"
        letter-spacing="1"
        fill="url(#whiteGrad)">AUTOTECH</text>

  <!-- Registered trademark -->
  <text x="600" y="365"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="26"
        fill="#ffffff">&#174;</text>
</svg>
