<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="100%" height="100%">
  <defs>
    <!-- Brand Red Gradient -->
    <linearGradient id="brandRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E51D24"/>
      <stop offset="100%" stop-color="#D71920"/>
    </linearGradient>
  </defs>

  <!-- 4M High-Performance Slanted Glyph Group -->
  <g transform="skewX(-11) translate(90, 15)">
    <!-- Custom Slanted 4 (Vibrant Racing Red) -->
    <path d="
      M 270,75
      L 365,75
      L 365,305
      L 415,305
      L 415,385
      L 365,385
      L 365,465
      L 270,465
      L 270,385
      L 115,385
      L 115,310
      L 205,175
      L 270,75
      Z
      M 270,195
      L 190,305
      L 270,305
      Z
    " fill="url(#brandRedGrad)" fill-rule="evenodd"/>

    <!-- Custom Slanted M (Crisp White) -->
    <path d="
      M 435,465
      L 435,75
      L 535,75
      L 625,335
      L 715,75
      L 815,75
      L 815,465
      L 730,465
      L 625,205
      L 520,465
      Z
    " fill="#FFFFFF"/>
  </g>

  <!-- AUTOTECH (Crisp Bold Uppercase Sans-Serif) -->
  <text x="460" y="540"
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Montserrat', 'Arial Black', 'Helvetica Neue', sans-serif"
        font-weight="900"
        font-size="82"
        letter-spacing="10"
        fill="#FFFFFF">AUTOTECH</text>
</svg>